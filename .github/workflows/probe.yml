name: 数据源连通性诊断

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet akshare==1.20.37 efinance pandas

      - name: 探测数据源（带超时）
        run: |
          timeout 420 python probe.py || echo "PROBE_EXIT=$?"
        continue-on-error: true
