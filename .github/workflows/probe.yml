name: 数据源连通性诊断

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet akshare==1.20.37 efinance pandas

      - name: 探测数据源
        run: python probe.py

      - name: 上传 probe 脚本
        run: echo done
